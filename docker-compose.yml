# One-command stack:  cp ai-service/.env.example ai-service/.env  (add your key)  &&  docker compose up --build
# UI: http://localhost:8080   API docs: http://localhost:3000/api/docs
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    ports: ["3000:3000"]
    volumes: [backend-data:/data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  ai-service:
    build: ./ai-service
    env_file: ai-service/.env
    environment:
      BACKEND_URL: http://backend:3000/api
    ports: ["8000:8000"]
    volumes: [ai-data:/data]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend, ai-service]

volumes:
  backend-data:
  ai-data:
