# One-command stack:  cp ai-service/.env.example ai-service/.env  (add your key)  &&  docker compose up --build
# With tracing:       docker compose -f observability/otel/docker-compose.yml up -d     (Jaeger UI :16686)
#                     docker compose -f observability/langfuse/docker-compose.yml -f observability/langfuse/docker-compose.override.yml up -d   (Langfuse :3100)
#                     OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318 docker compose up --build
# UI: http://localhost:8080   API docs: http://localhost:3000/api/docs
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      # tracing (optional): start observability/otel first; empty = off
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: clinicpilot-backend
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["3000:3000"]
    volumes: [backend-data:/data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      start_period: 30s
      retries: 10

  ai-service:
    build: ./ai-service
    env_file: ai-service/.env
    environment:
      BACKEND_URL: http://backend:3000/api
      MEMORY_DB: /data/memory.sqlite3            # long-term memory on the volume, survives rebuilds
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: clinicpilot-ai-service
      # Langfuse keys come from ai-service/.env; inside a container "localhost" is the container itself
      LANGFUSE_HOST: ${LANGFUSE_HOST_FOR_CONTAINERS:-http://host.docker.internal:3100}
    extra_hosts: ["host.docker.internal:host-gateway"]
    expose: ["8000"]   # internal only: the UI and clients go through the backend
    volumes: [ai-data:/data]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [backend, ai-service]

volumes:
  backend-data:
  ai-data:
