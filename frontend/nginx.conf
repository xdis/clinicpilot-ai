server {
  listen 8080;
  root /usr/share/nginx/html;
  location /api/ {
    client_max_body_size 16m;   # consultation recordings (backend and AI service accept up to 15 MB)
    proxy_pass http://backend:3000/api/;
    proxy_read_timeout 120s;
  }
  location / {
    try_files $uri /index.html;
  }
}
